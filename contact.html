<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheatbee Ltd | Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">Wheatbee Ltd</div>
        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <main>
        <section class="page-intro">
            <p class="eyebrow">Reach us</p>
            <h1>Contact Wheatbee Ltd</h1>
        </section>

        <section class="contact-page">
            <div class="contact-card">
                <h2>Get in touch</h2>
                <p><strong>Address:</strong> Nairobi, Kenya</p>
                <p><strong>Phone:</strong> +254 700 000 000</p>
                <p><strong>Email:</strong> hello@wheatbee.co.ke</p>
            </div>

            <form class="contact-form">
                <label>
                    Name
                    <input type="text" placeholder="Your name">
                </label>
                <label>
                    Email
                    <input type="email" placeholder="Your email">
                </label>
                <label>
                    Message
                    <textarea placeholder="How can we help?"></textarea>
                </label>
                <button type="submit" class="btn">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Wheatbee Ltd. All rights reserved.</p>
    </footer>
</body>
</html>
